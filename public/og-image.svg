<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Editorial Warm Paper Canvas -->
  <rect width="1200" height="630" fill="#F8F7F2"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#111111" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#111111" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Left Column: Editorial Branding & Headline -->
  
  <!-- Top Badge & Identity -->
  <g transform="translate(70, 70)">
    <!-- Actual Logo Image -->
    <clipPath id="logoClip">
      <circle cx="28" cy="28" r="28"/>
    </clipPath>
    <rect x="0" y="0" width="56" height="56" rx="28" fill="#000000"/>
    <image href="data:image/jpeg;base64," x="0" y="0" width="56" height="56" clip-path="url(#logoClip)"/>
    
    <!-- Legal Name & LLPIN -->
    <text x="72" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#111111" letter-spacing="-0.3">LOOMENFLY LABS LLP</text>
    <text x="72" y="48" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#E51E25" letter-spacing="1">LLPIN: ACZ-5532 • KERALA, INDIA</text>
  </g>

  <!-- FlowDesk Product Pill -->
  <g transform="translate(70, 150)">
    <rect width="210" height="32" rx="16" fill="#111111" fill-opacity="0.05" stroke="#111111" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#E51E25"/>
    <text x="28" y="20" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#111111" letter-spacing="0.5">FLOWDESK PLATFORM</text>
  </g>

  <!-- Editorial Headline -->
  <g transform="translate(70, 240)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#111111" letter-spacing="-0.5">Turn Your Messages</text>
    <text x="0" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#111111" letter-spacing="-0.5">Into <tspan fill="#E51E25">Bookings.</tspan></text>
    
    <!-- Yellow hand-drawn accent arc below 'Bookings.' -->
    <path d="M125 72 Q 220 86 315 72" fill="none" stroke="#FFD100" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Subtitle -->
  <text x="70" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#111111" fill-opacity="0.65" width="480">
    <tspan x="70" dy="0">Automated WhatsApp booking infrastructure</tspan>
    <tspan x="70" dy="28">&amp; real-time management dashboard.</tspan>
  </text>

  <!-- Bottom Divider & Footer -->
  <line x1="70" y1="510" x2="550" y2="510" stroke="#111111" stroke-opacity="0.1" stroke-width="1"/>
  
  <g transform="translate(70, 545)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111111">loomenflylabs.com</text>
    <text x="145" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#111111" fill-opacity="0.3">•</text>
    <text x="165" y="0" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="600" fill="#E51E25">admin@loomenflylabs.com</text>
  </g>


  <!-- Right Column: Clean Floating FlowDesk Mockup Card -->
  <g transform="translate(620, 80)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="500" height="470" rx="24" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Card Header -->
    <rect width="500" height="54" rx="24" fill="#FAFAFA"/>
    <line x1="0" y1="54" x2="500" y2="54" stroke="#111111" stroke-opacity="0.06" stroke-width="1"/>
    
    <!-- Browser Window Dots -->
    <circle cx="28" cy="27" r="5" fill="#111111" fill-opacity="0.15"/>
    <circle cx="44" cy="27" r="5" fill="#111111" fill-opacity="0.15"/>
    <circle cx="60" cy="27" r="5" fill="#111111" fill-opacity="0.15"/>
    
    <text x="90" y="32" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600" fill="#111111" fill-opacity="0.5">flowdesk.loomenflylabs.com</text>

    <!-- Meta Tech Provider Pill in Header -->
    <g transform="translate(330, 14)">
      <rect width="145" height="26" rx="13" fill="#25D366" fill-opacity="0.12"/>
      <circle cx="12" cy="13" r="3.5" fill="#25D366"/>
      <text x="22" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#075E54">WhatsApp Cloud API</text>
    </g>

    <!-- Chat Flow Conversation Simulation -->
    
    <!-- Customer Message Bubble (Inbound) -->
    <g transform="translate(28, 85)">
      <rect width="320" height="60" rx="14" fill="#F1F3F5"/>
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#111111">
        <tspan x="16" dy="0">"Hi! I'd like to book an appointment</tspan>
        <tspan x="16" dy="18">for tomorrow at 10:00 AM."</tspan>
      </text>
      <text x="270" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#111111" fill-opacity="0.4">10:02 AM</text>
    </g>

    <!-- FlowDesk Bot Reply Bubble (Outbound Auto-Confirmation) -->
    <g transform="translate(130, 165)">
      <rect width="340" height="110" rx="14" fill="#D9FDD3" stroke="#25D366" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#075E54">
        FlowDesk Auto-Booking:
      </text>
      <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#111111">
        <tspan x="16" dy="0">✅ Appointment Confirmed!</tspan>
        <tspan x="16" dy="20">📅 Tomorrow at 10:00 AM</tspan>
        <tspan x="16" dy="20">🔗 Synced to Calendar &amp; Dashboard</tspan>
      </text>
      <text x="290" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#075E54" fill-opacity="0.7">10:02 AM ✓✓</text>
    </g>

    <!-- Bottom Dashboard Integration Strip -->
    <g transform="translate(28, 305)">
      <rect width="442" height="135" rx="16" fill="#FAF9F5" stroke="#111111" stroke-opacity="0.06" stroke-width="1"/>
      
      <!-- Metrics row -->
      <text x="20" y="30" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#E51E25" letter-spacing="0.5">LIVE MANAGEMENT DASHBOARD</text>
      
      <g transform="translate(20, 46)">
        <!-- Stat 1 -->
        <rect width="125" height="66" rx="10" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.06" stroke-width="1"/>
        <text x="12" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#888888">SYNC STATUS</text>
        <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#25D366">● Real-time</text>

        <!-- Stat 2 -->
        <g transform="translate(135, 0)">
          <rect width="125" height="66" rx="10" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.06" stroke-width="1"/>
          <text x="12" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#888888">AVG RESPONSE</text>
          <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#111111">&lt; 2 Seconds</text>
        </g>

        <!-- Stat 3 -->
        <g transform="translate(270, 0)">
          <rect width="132" height="66" rx="10" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.06" stroke-width="1"/>
          <text x="12" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#888888">INTEGRATION</text>
          <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#E51E25">Cloud API v21</text>
        </g>
      </g>
    </g>
  </g>
</svg>