  <circle cx="1050" cy="500" r="250" fill="#FFD100" opacity="0.06" filter="blur(70px)"/>
  
  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Logo Mark & Legal Title -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="#E51E25"/>
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">L</text>
    
    <text x="88" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">LOOMENFLY LABS LLP</text>
    <text x="88" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#888888" letter-spacing="1.2">LLPIN: ACZ-5532 • KERALA, INDIA</text>
  </g>

  <!-- FlowDesk Badge -->
  <g transform="translate(940, 84)">
